plugins { id "com.android.application" }

android {
    namespace "com.catatanlapangan.survey"
    compileSdk 36

    defaultConfig {
        applicationId "com.catatanlapangan.survey"
        minSdk 21
        targetSdk 36
        versionCode 11
        versionName "2.1"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed afterwards with the owner's key, which never goes into this public repository.
            signingConfig null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
